# Claude Code compatible SessionStart hooks for DSH.
# This ships with no hooks. Add your own commands in your profile layer
# (~/.dsh/profiles/<profile>/cordis.patch.yml) so local paths stay out of git:
#
#   - id: claude-code-hooks
#     name: "@local/dsh-plugin-claude-hooks"
#     config:
#       includeSubagents: false
#       hooks:
#         SessionStart:
#           - command: 'C:\Program Files\Git\bin\bash.exe'
#             args: ['path/to/hook.sh']
#             timeoutMs: 15000
- insert:
    - id: claude-code-hooks
      name: '@local/dsh-plugin-claude-hooks'
      config:
        includeSubagents: false
        hooks:
          SessionStart: []
